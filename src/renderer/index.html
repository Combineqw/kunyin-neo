<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>坤音neo</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- 渲染层不直接访问外网（网络由主进程负责）；此处放开：远程封面图、直链/自定义协议音频、HMR 的 ws。
         非加密音频 <audio> 直连远程直链故 media-src 放行 http/https；加密流走 kunyin://。
         如需收紧可改用 session.webRequest 做 CDN 主机白名单（参考 lx-music）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: kunyin: http: https:; media-src 'self' blob: data: kunyin: http: https:; font-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #171918;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #startup-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 32px;
        color: #f5f5f5;
        font: 14px/1.6 "Microsoft YaHei", sans-serif;
      }
    </style>
    <!-- 此脚本必须早于模块入口：模块图加载失败时仍能显示实际原因，且不放宽 CSP。 -->
    <script src="/startup-diagnostics.js"></script>
  </head>

  <body>
    <div id="app"><div id="startup-fallback">正在启动坤音neo...</div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
