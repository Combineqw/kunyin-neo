<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kunyin Tauri Core Shell</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background: #101517;
        color: #e4ece8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { max-width: 900px; margin: 0 auto; padding: 40px 28px; }
      h1 { margin: 0; font-size: 24px; font-weight: 650; }
      p { color: #a8b6b0; line-height: 1.5; }
      .toolbar { display: flex; align-items: center; gap: 12px; margin: 22px 0 12px; }
      button { border: 1px solid #77c9a1; border-radius: 5px; padding: 9px 14px; background: #18392e; color: #dcfff0; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: wait; }
      .status { min-height: 24px; color: #9fc8b4; font-size: 13px; }
      textarea, pre { width: 100%; border: 1px solid #394944; border-radius: 5px; background: #171f21; color: #e4ece8; font: 13px/1.55 Consolas, monospace; }
      textarea { min-height: 180px; padding: 14px; resize: vertical; }
      pre { min-height: 120px; padding: 14px; overflow: auto; white-space: pre-wrap; }
      h2 { margin: 24px 0 10px; font-size: 15px; font-weight: 600; }
      @media (max-width: 600px) { main { padding: 24px 16px; } .toolbar { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Kunyin · Rust Core</h1>
      <p>歌词行解析由 Tauri command 调用共享的 aurora-core。</p>
      <textarea id="input" aria-label="LRC 歌词">[00:01.20]第一行歌词
[00:02.50]第二行歌词</textarea>
      <div class="toolbar">
        <button id="run" type="button">解析歌词</button>
        <span id="status" class="status" role="status"></span>
      </div>
      <h2>Rust 返回值</h2>
      <pre id="output">等待解析</pre>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
