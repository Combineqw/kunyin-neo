# aurora-native · Electron's Node-API adapter for aurora-core
#
# Produces a .node library. Domain logic lives in crates/aurora-core.
#
# Adapter dependencies: napi / napi-derive / aurora-core.
[package]
name = "aurora-native"
version = "0.1.0"
edition = "2021"
# 不发布到 crates.io：仓库内部模块
publish = false

[lib]
# cdylib 才能产出 Node 可加载的动态库
crate-type = ["cdylib"]

[dependencies]
# napi 4 + Node-API 8：跨 Node/Electron ABI 通用，换 Electron 版本不用重编
napi = { version = "2.16", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16"
aurora-core = { path = "../aurora-core" }
aurora-player = { path = "../aurora-player" }
aurora-audio = { path = "../aurora-audio" }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
# ThinLTO avoids the multi-gigabyte LLVM peak seen with the growing native
# adapter while retaining release optimization for the shipped .node binary.
lto = "thin"
strip = "symbols"
