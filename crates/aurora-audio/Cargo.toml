[package]
name = "aurora-audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-neutral audio backend boundary and bounded PCM transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }

# cpal's Windows backend is WASAPI shared mode by default. Keep this target
# specific so Linux/macOS checks and the host-neutral decoder do not pull in a
# platform output stack before their native adapters are ready.
[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
