[package]
name = "aurora-app"
version = "1.1.0"
edition = "2021"
publish = false
description = "Pure Rust Native Music Player Desktop Application for KUNYIN Neo (Zero WebView / Zero Electron)"

[dependencies]
aurora-core = { path = "../aurora-core" }
aurora-player = { path = "../aurora-player" }
aurora-library = { path = "../aurora-library" }
aurora-audio = { path = "../aurora-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 1
