[package]
name = "aurora-library"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite-backed local library repository shared by the Electron and Tauri adapters"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The repository owns schema creation and migration; adapters only provide a path.

